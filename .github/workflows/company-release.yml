name: Company Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.16.5-company.1"
        required: true
        type: string
  push:
    tags:
      - "v*-company.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: company-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"
  PNPM_VERSION: "10.12.3"

jobs:
  resolve:
    name: Resolve immutable company release identity
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      company_iteration: ${{ steps.meta.outputs.company_iteration }}
      build_sha: ${{ steps.meta.outputs.build_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY_META'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          base = json.loads(Path("package.json").read_text())["version"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)-company\.([1-9][0-9]*)", tag)
          if not match or match[1] != base:
              raise SystemExit("Release tag must match v<package-version>-company.<positive integer>")
          iteration = int(match[2])
          if iteration > 65535:
              raise SystemExit("Company iteration exceeds the MSI build field limit")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tag_sha = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          if sha != tag_sha:
              raise SystemExit("Release tag does not match the checked-out build SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in {"tag": tag, "version": tag[1:], "upstream_version": base,
                                 "company_iteration": iteration, "build_sha": sha}.items():
                  output.write(f"{key}={value}\n")
          PY_META

  build:
    name: Build ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            platform: windows-x64
          - name: macOS Universal
            os: macos-14
            platform: macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.build_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare company build version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
          COMPANY_ITERATION: ${{ needs.resolve.outputs.company_iteration }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS_VERSION'
          import fs from 'node:fs';
          const version = process.env.VERSION;
          const base = process.env.UPSTREAM_VERSION;
          const iteration = process.env.COMPANY_ITERATION;
          if (version !== `${base}-company.${iteration}` || !/^[1-9][0-9]*$/.test(iteration)) {
            throw new Error('Invalid company build identity');
          }
          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (config.version !== base) throw new Error(`Unexpected base version in ${file}`);
            config.version = version;
            if (file.endsWith('tauri.conf.json')) {
              config.bundle.windows.wix.version = `${base}.${iteration}`;
            }
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          }
          for (const [file, section] of [['src-tauri/Cargo.toml', 'package'], ['src-tauri/Cargo.lock', '[package]']]) {
            const text = fs.readFileSync(file, 'utf8');
            // Restrict the replacement to the application's package, not dependency versions.
            const pattern = section === 'package'
              ? /(\[package\][\s\S]*?^version\s*=\s*")([^"]+)(")/m
              : /(\[\[package\]\]\r?\nname = "cc-switch"\r?\nversion = ")([^"]+)(")/;
            let replaced = false;
            const updated = text.replace(pattern, (_, prefix, old, suffix) => {
              if (old !== base) throw new Error(`Unexpected base version in ${file}`);
              replaced = true;
              return prefix + version + suffix;
            });
            if (!replaced) throw new Error(`Application version not found in ${file}`);
            fs.writeFileSync(file, updated);
          }
          JS_VERSION

      - name: Prepare Tauri updater signing key
        shell: bash
        env:
          RAW_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${RAW_PRIVATE_KEY:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for updater artifacts." >&2
            exit 1
          fi

          if command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN=python3
          else
            PYTHON_BIN=python
          fi

          "$PYTHON_BIN" - <<'PY'
          import base64
          import os
          import sys

          raw = os.environ["RAW_PRIVATE_KEY"].strip()

          def decode_private_key(value: str) -> str | None:
              try:
                  return base64.b64decode(value, validate=True).decode("utf-8")
              except Exception:
                  return None

          if raw.startswith("untrusted comment:"):
              private_key_text = raw
          else:
              decoded = decode_private_key(raw)
              if decoded and decoded.startswith("untrusted comment:"):
                  private_key_text = decoded
              else:
                  private_key_line = "".join(raw.split())
                  if not private_key_line:
                      print("TAURI_SIGNING_PRIVATE_KEY did not contain a private key.", file=sys.stderr)
                      sys.exit(1)
                  private_key_text = (
                      "untrusted comment: rsign encrypted secret key\n"
                      f"{private_key_line}\n"
                  )

          private_key_text = private_key_text.replace("\r\n", "\n").rstrip("\n") + "\n"
          signing_key = base64.b64encode(private_key_text.encode("utf-8")).decode("ascii")
          key_password = os.environ.get("PRIVATE_KEY_PASSWORD", "")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"TAURI_SIGNING_PRIVATE_KEY={signing_key}\n")
              env.write(f"TAURI_PRIVATE_KEY={signing_key}\n")
              env.write(f"TAURI_SIGNING_PRIVATE_KEY_PASSWORD={key_password}\n")
              env.write(f"TAURI_PRIVATE_KEY_PASSWORD={key_password}\n")
          PY

      - name: Validate Tauri updater signing key
        shell: bash
        run: |
          set -euo pipefail
          validation_file="$RUNNER_TEMP/tauri-signing-validation.txt"
          printf 'cc-switch updater signing validation\n' > "$validation_file"
          pnpm tauri signer sign "$validation_file" >/dev/null

      - name: Build Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles msi

      - name: Build macOS universal
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build --target universal-apple-darwin --bundles app

      - name: Prepare Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $targetRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          if (-not (Test-Path $targetRoot)) {
            $targetRoot = 'src-tauri/target/release'
          }

          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows x64 MSI was produced.'
          }

          $msiDest = "CC-Switch-$env:TAG-Windows-company-x64.msi"
          Copy-Item $msi.FullName (Join-Path release-assets $msiDest)
          if (Test-Path "$($msi.FullName).sig") {
            Copy-Item "$($msi.FullName).sig" (Join-Path release-assets "$msiDest.sig")
          } else {
            throw "No updater signature produced for $($msi.Name)."
          }

          $exe = Join-Path $targetRoot 'cc-switch.exe'
          if (-not (Test-Path $exe)) {
            throw 'No Windows x64 executable was produced.'
          }
          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe $portableDir
          @(
            '# CC Switch company portable x64 build marker',
            'portable=true',
            'edition=company',
            'arch=x64'
          ) | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/CC-Switch-$env:TAG-Windows-company-x64-Portable.zip" -Force

      - name: Prepare macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          app_path="$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d | head -1)"
          tar_path="$(find "$bundle_dir" -maxdepth 1 -name '*.tar.gz' -type f | head -1)"
          if [ -z "$app_path" ]; then
            echo "No macOS .app was produced." >&2
            exit 1
          fi
          if [ -z "$tar_path" ]; then
            echo "No macOS updater tar.gz was produced." >&2
            exit 1
          fi

          tar_dest="CC-Switch-$TAG-macOS-company-universal.tar.gz"
          cp "$tar_path" "release-assets/$tar_dest"
          if [ -f "$tar_path.sig" ]; then
            cp "$tar_path.sig" "release-assets/$tar_dest.sig"
          else
            echo "No updater signature produced for macOS tar.gz." >&2
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/CC-Switch-$TAG-macOS-company-universal.zip"

      - name: Record artifact provenance
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS_PROVENANCE'
          import fs from 'node:fs';
          const { TAG: tag, VERSION: version, BUILD_SHA: build_sha, PLATFORM: platform } = process.env;
          fs.writeFileSync(`release-assets/provenance-${platform}.json`, JSON.stringify({ tag, version, build_sha }));
          JS_PROVENANCE

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: company-release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish company release
    runs-on: ubuntu-22.04
    needs: [resolve, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.build_sha }}

      - name: Require successful CI for release source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$BUILD_SHA" --event push --limit 20 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "No valid push CI run found for release source $BUILD_SHA" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: company-release-*
          path: release-assets
          merge-multiple: true

      - name: Verify artifact provenance
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_PROVENANCE'
          import json
          import os
          from pathlib import Path
          expected = {key: os.environ[env] for key, env in
                      [("tag", "TAG"), ("version", "VERSION"), ("build_sha", "BUILD_SHA")]}
          for platform in ["windows-x64", "macos-universal"]:
              actual = json.loads(Path(f"release-assets/provenance-{platform}.json").read_text())
              if actual != expected:
                  raise SystemExit(f"Artifact provenance mismatch for {platform}")
          PY_PROVENANCE

      - name: Add GitHub installer scripts
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cp release/cc-switch-update/install.sh release-assets/install.sh
          cp release/cc-switch-update/install.ps1 release-assets/install.ps1
          chmod +x release-assets/install.sh

          source_sh="release/cc-switch-update/install.sh"
          pinned_sh="release-assets/install-$TAG.sh"
          if [ "$(head -n 1 "$source_sh")" != '#!/usr/bin/env bash' ]; then
            echo "Unexpected install.sh header" >&2
            exit 1
          fi
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf 'export CC_SWITCH_RELEASE_TAG=%q\n' "$TAG"
            tail -n +2 "$source_sh"
          } > "$pinned_sh"
          chmod +x "$pinned_sh"

          source_ps1="release/cc-switch-update/install.ps1"
          pinned_ps1="release-assets/install-$TAG.ps1"
          awk -v tag="$TAG" '
            replacements == 0 && /^[[:space:]]*\[string\]\$ReleaseTag = \$env:CC_SWITCH_RELEASE_TAG,$/ {
              print "  [string]$ReleaseTag = \047" tag "\047,"
              replacements++
              next
            }
            { print }
            END {
              if (replacements != 1) {
                print "Expected exactly one ReleaseTag default in install.ps1" > "/dev/stderr"
                exit 1
              }
            }
          ' "$source_ps1" > "$pinned_ps1"

      - name: Generate latest-company.json
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.resolve.outputs.upstream_version }}
          COMPANY_ITERATION: ${{ needs.resolve.outputs.company_iteration }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_url="https://github.com/$REPO/releases/download/$TAG"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          win_msi="$(find release-assets -maxdepth 1 -name '*Windows-company-x64.msi' -type f | head -1)"
          win_sig="$(cat "$win_msi.sig")"
          win_sha="$(sha256sum "$win_msi" | awk '{print $1}')"
          mac_tgz="$(find release-assets -maxdepth 1 -name '*macOS-company-universal.tar.gz' -type f | head -1)"
          mac_sig="$(cat "$mac_tgz.sig")"
          mac_sha="$(sha256sum "$mac_tgz" | awk '{print $1}')"
          win_name="$(basename "$win_msi")"
          mac_name="$(basename "$mac_tgz")"
          cat > release-assets/latest-company.json <<EOF_JSON
          {
            "version": "$VERSION",
            "upstream_version": "$UPSTREAM_VERSION",
            "company_iteration": $COMPANY_ITERATION,
            "release_tag": "$TAG",
            "build_sha": "$BUILD_SHA",
            "notes": "CC Switch company release $TAG",
            "pub_date": "$pub_date",
            "installer_url": "$base_url/install-$TAG.sh",
            "installer_urls": {
              "windows": "$base_url/install-$TAG.ps1",
              "windows-x86_64": "$base_url/install-$TAG.ps1",
              "macos": "$base_url/install-$TAG.sh",
              "darwin-aarch64": "$base_url/install-$TAG.sh",
              "darwin-x86_64": "$base_url/install-$TAG.sh",
              "darwin-universal": "$base_url/install-$TAG.sh"
            },
            "release_notes_url": "https://github.com/$REPO/releases/tag/$TAG",
            "platforms": {
              "windows-x86_64": {
                "signature": "$win_sig",
                "url": "$base_url/$win_name"
              },
              "darwin-aarch64": {
                "signature": "$mac_sig",
                "url": "$base_url/$mac_name"
              },
              "darwin-x86_64": {
                "signature": "$mac_sig",
                "url": "$base_url/$mac_name"
              },
              "darwin-universal": {
                "signature": "$mac_sig",
                "url": "$base_url/$mac_name"
              }
            },
            "installers": {
              "windows-x86_64": {
                "kind": "msi",
                "sha256": "$win_sha",
                "script_url": "$base_url/install-$TAG.ps1",
                "url": "$base_url/$win_name"
              },
              "darwin-aarch64": {
                "kind": "tar.gz",
                "sha256": "$mac_sha",
                "script_url": "$base_url/install-$TAG.sh",
                "url": "$base_url/$mac_name"
              },
              "darwin-x86_64": {
                "kind": "tar.gz",
                "sha256": "$mac_sha",
                "script_url": "$base_url/install-$TAG.sh",
                "url": "$base_url/$mac_name"
              },
              "darwin-universal": {
                "kind": "tar.gz",
                "sha256": "$mac_sha",
                "script_url": "$base_url/install-$TAG.sh",
                "url": "$base_url/$mac_name"
              }
            }
          }
          EOF_JSON

      - name: Validate release metadata and installers
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
        run: |
          set -euo pipefail
          pinned_sh="release-assets/install-$TAG.sh"
          pinned_ps1="release-assets/install-$TAG.ps1"

          test -s "$pinned_sh"
          test -s "$pinned_ps1"
          bash -n "$pinned_sh"
          grep -F "export CC_SWITCH_RELEASE_TAG=$TAG" "$pinned_sh" >/dev/null
          grep -F "[string]\$ReleaseTag = '$TAG'," "$pinned_ps1" >/dev/null

          export PINNED_PS1="$pinned_ps1"
          # PowerShell variables must reach pwsh unchanged.
          # shellcheck disable=SC2016
          pwsh -NoLogo -NoProfile -Command '
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $env:PINNED_PS1,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            # Dot-source functions only; mock metadata and never invoke the installer.
            . $env:PINNED_PS1
            $script:fixtureMetadata = Get-Content release-assets/latest-company.json -Raw | ConvertFrom-Json
            function Get-CCSwitchLatestMetadata {
              param([string]$Url)
              return $script:fixtureMetadata
            }
            $info = Get-CCSwitchInstallerInfo -Repo $env:REPO -Arch x86_64
            if ($info.Status -ne "ready" -or $info.Kind -ne "msi" -or -not $info.Url) {
              throw "Generated manifest did not resolve to a ready Windows MSI"
            }
          '

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          metadata = json.loads(Path("release-assets/latest-company.json").read_text())

          expected_scripts = {
              "windows": f"{base_url}/install-{tag}.ps1",
              "windows-x86_64": f"{base_url}/install-{tag}.ps1",
              "macos": f"{base_url}/install-{tag}.sh",
              "darwin-aarch64": f"{base_url}/install-{tag}.sh",
              "darwin-x86_64": f"{base_url}/install-{tag}.sh",
              "darwin-universal": f"{base_url}/install-{tag}.sh",
          }
          assert metadata["version"] == os.environ["VERSION"] == tag[1:]
          assert metadata["release_tag"] == tag
          assert metadata["build_sha"] == os.environ["BUILD_SHA"]
          assert metadata["company_iteration"] == int(tag.rsplit(".", 1)[1])
          assert metadata["version"] == f'{metadata["upstream_version"]}-company.{metadata["company_iteration"]}'
          assert metadata["installer_url"] == expected_scripts["darwin-universal"]
          assert metadata["installer_urls"] == expected_scripts

          for platform, script_url in expected_scripts.items():
              if platform in {"windows", "macos"}:
                  continue
              assert metadata["platforms"][platform]["url"].startswith(f"{base_url}/")
              assert metadata["installers"][platform]["url"] == metadata["platforms"][platform]["url"]
              assert metadata["installers"][platform]["script_url"] == script_url
          PY

      - name: Verify release tag is still bound to build SHA
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD_SHA: ${{ needs.resolve.outputs.build_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$BUILD_SHA"
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: CC Switch Company ${{ needs.resolve.outputs.tag }}
          prerelease: false
          make_latest: true
          body: |
            ## CC Switch Company ${{ needs.resolve.outputs.tag }}

            公司版发布产物，请优先下载对应平台安装包。

            - Windows x64: `CC-Switch-${{ needs.resolve.outputs.tag }}-Windows-company-x64.msi`
            - Windows x64 Portable: `CC-Switch-${{ needs.resolve.outputs.tag }}-Windows-company-x64-Portable.zip`
            - macOS Universal: `CC-Switch-${{ needs.resolve.outputs.tag }}-macOS-company-universal.zip`
            - macOS pinned installer: `install-${{ needs.resolve.outputs.tag }}.sh`
            - Windows pinned installer: `install-${{ needs.resolve.outputs.tag }}.ps1`

            `latest-company.json` 用于公司版自动更新。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
